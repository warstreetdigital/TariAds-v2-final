  <!-- Site Header -->

    <div class="container header-inner">
      <a href="index.html" class="brand-logo" title="TariAds Marketplace">
        <div class="brand-icon-box">T</div>

      <!-- Ecosystem Mode Switch: Marketplace ↔ Billboard -->
      <div class="ecosystem-mode-switch" role="tablist" aria-label="TariAds Experience Mode">
        <a href="index.html" class="mode-btn active" id="modeMarketplace" role="tab" aria-selected="true" title="TariAds Marketplace — Discover and List">
          <svg class="mode-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

            <polyline points="9 22 9 12 15 12 15 22"/>

          <svg class="mode-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="3" rx="2"/>
            <line x1="8" x2="16" y1="21" y2="21"/>
            <line x1="12" x2="12" y1="17" y2="21"/>
          </svg>
          <span>Billboard</span>
        </a>
      </div>

      <!-- Header Actions -->
      <div class="header-actions">
        <a href="saved.html" class="saved-btn" title="Saved Items">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span class="saved-label">Saved</span>
          <span class="badge-count saved-count-display" style="display:none;">0</span>
        </a>

        <a href="post-listing.html?type=product" class="btn btn-primary btn-sm header-post-btn" id="headerListBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          <span class="post-btn-text">Post Agri Listing</span>
        </a>

        <button class="mobile-menu-btn" id="mobileMenuToggle" aria-label="Toggle Navigation Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="drawer-footer-action">
      <a href="post-listing.html" class="btn btn-primary" style="width:100%; text-align:center;">+ Post a Listing</a>
    </div>
  </div>

  <!-- Persistent Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
    <a href="index.html" class="bottom-nav-item" id="bnavHome">
      <svg class="bnav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="discover.html" class="bottom-nav-item" id="bnavDiscover">
      <svg class="bnav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
      <span>Discover</span>
    </a>
    <a href="categories.html" class="bottom-nav-item active" id="bnavCategories">
      <svg class="bnav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="7" x="3" y="3" rx="1"/>
        <rect width="7" height="7" x="14" y="3" rx="1"/>
        <rect width="7" height="7" x="14" y="14" rx="1"/>
        <rect width="7" height="7" x="3" y="14" rx="1"/>
      </svg>
      <span>Categories</span>
    </a>
    <a href="saved.html" class="bottom-nav-item" id="bnavSaved">
      <svg class="bnav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>

        </svg>

  <!-- Futuristic Category Explorer Mount -->
  <main id="agriExplorerMount"></main>

  <script type="module" src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/category-explorer.js"></script>
  <script type="module">
    import { CategoryExplorer } from "./js/category-explorer.js";

    document.addEventListener("DOMContentLoaded", () => {
      const mountEl = document.getElementById("agriExplorerMount");
      if (mountEl) {
        const urlParams = new URLSearchParams(window.location.search);
        const sub = urlParams.get("cat") || urlParams.get("type") || "all";
        CategoryExplorer.mount(mountEl, "agriculture", {
          initialSubcategory: sub,
          initialSearch: urlParams.get("q") || ""
        });
      }
    });
  </script>
</body>
