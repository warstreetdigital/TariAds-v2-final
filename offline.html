<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline — TariAds</title>
  <meta name="theme-color" content="#075E34">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #000000;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: #121212;
      border: 1px solid #222222;
      border-radius: 18px;
      padding: 2.25rem 1.75rem;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #075E34, #0A7E46);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 14px rgba(7, 94, 52, 0.45);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 6px #EF4444;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #9CA3AF;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .retry-btn {
      background: #075E34;
      color: #FFFFFF;
      border: none;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 0.85rem 1.6rem;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      text-decoration: none;
    }
    .retry-btn:hover {
      background: #097240;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="brand-mark" aria-hidden="true">T</div>
    <div class="status-pill">
      <span class="status-dot"></span>
      No Internet Connection
    </div>
    <h1>You're Currently Offline</h1>
    <p>TariAds requires an active connection to explore live verified listings, vehicle inventories, and commercial video reels across Harare.</p>
    <button type="button" class="retry-btn" id="retryBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 16h5v5"/>
      </svg>
      <span>Check Connection & Retry</span>
    </button>
    <div class="hint">Your app will automatically reconnect once your data or Wi-Fi is restored.</div>
  </div>

  <script>
    document.getElementById('retryBtn').addEventListener('click', function() {
      this.disabled = true;
      this.innerHTML = '<span>Checking connection...</span>';
      setTimeout(() => {
        window.location.reload();
      }, 300);
    });

    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
