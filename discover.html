<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TariAds">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Reels — TariAds</title>
  <meta name="description" content="Watch full-screen vertical commercial reels and business showcases on TariAds.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="prefetch" href="index.html">
  <link rel="prefetch" href="categories.html">
  <link rel="prefetch" href="saved.html">
</head>
<body class="reels-page">

  <!-- Desktop Ambient Background Stage -->
  <div class="reels-stage-wrapper">
    <div class="reels-desktop-ambient"></div>

    <!-- Main Full-Screen Reels Viewport Frame (No persistent bottom nav) -->
    <main class="reels-app-viewport" id="reelsAppViewport">

      <!-- Immersive Full-Screen Vertical Video Stage -->
      <div class="reels-fullscreen-stage" id="reelsFullscreenStage">
        
        <!-- Video Element (Occupies almost entire screen, object-fit: contain, no stretching) -->
        <video 
          class="reels-active-video" 
          id="reelsActiveVideo" 
          playsinline 
          webkit-playsinline 
          preload="metadata"
          muted
        ></video>

        <!-- Tap Feedback Flash -->
        <div class="reels-tap-feedback" id="reelsTapFeedback" aria-hidden="true">
          <svg id="reelsTapIcon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </div>

        <!-- Buffering Spinner -->
        <div class="reels-buffering-spinner" id="reelsBufferingSpinner" aria-hidden="true"></div>

        <!-- Video Error State Overlay with Retry -->
        <div class="reel-viewer-error-box" id="reelsErrorBox">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h4 class="reel-viewer-error-title">Video Unavailable</h4>
          <p class="reel-viewer-error-desc">This commercial video could not be played. Please check your network connection.</p>
          <button type="button" class="reel-viewer-retry-btn" id="reelsRetryBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
            Retry Playback
          </button>
        </div>

        <!-- Desktop Navigation Floating Chevrons (Up / Down) -->
        <button type="button" class="reels-nav-chevron reels-chevron-up" id="reelsChevronPrev" aria-label="Previous Reel" title="Previous Reel (Up)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 15-6-6-6 6"/>
          </svg>
        </button>
        <button type="button" class="reels-nav-chevron reels-chevron-down" id="reelsChevronNext" aria-label="Next Reel" title="Next Reel (Down)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>

        <!-- 1. TOP BAR — BUSINESS IDENTITY (Positioned at the very top of the video experience) -->
        <header class="reels-top-overlay" id="reelsTopOverlay">
          <div class="reels-top-left-identity">
            <div class="reels-top-avatar" id="reelsTopAvatar">
              <span id="reelsTopInitials">MG</span>
            </div>
            <div class="reels-top-meta">
              <div class="reels-top-name-row">
                <span class="reels-top-business-name" id="reelsTopBusinessName">Massive Gadgets</span>
                <svg id="reelsTopVerifiedBadge" class="reels-verified-icon" width="14" height="14" viewBox="0 0 24 24" fill="#075E34" stroke="#FFFFFF" stroke-width="2" style="display:none;" aria-label="Verified Advertiser">
                  <path d="M12 2l3.09 3.26 4.41-.65 1.57 4.19 3.93 2.05-1.57 4.19.65 4.41-4.41.65-3.09 3.26-3.09-3.26-4.41-.65-.65-4.41-3.93-2.05 1.57-4.19-1.57-4.19 4.41-.65z"/>
                  <polyline points="9 12 11 14 15 10" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
                </svg>
                <span class="reels-top-sponsored-tag" id="reelsTopSponsoredTag" style="display:none;">Sponsored</span>
              </div>
              <span class="reels-top-location" id="reelsTopLocation">Harare CBD, Zimbabwe</span>
            </div>
          </div>

          <div class="reels-top-right-actions">
            <!-- Sound Toggle Button -->
            <button type="button" class="reels-circle-ctrl-btn" id="reelsTopSoundBtn" aria-label="Toggle sound" title="Toggle audio">
              <svg id="topSoundIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>

            <!-- Circular Close (X) Button -->
            <button type="button" class="reels-circle-ctrl-btn reels-close-btn" id="reelsCloseBtn" aria-label="Close viewer" title="Return to Home">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </header>

        <!-- 3 & 4. BOTTOM OVERLAY — CAPTION & COMPACT HORIZONTAL OUTLINE ACTIONS -->
        <footer class="reels-bottom-overlay" id="reelsBottomOverlay">
          
          <!-- Caption (Short, natural sentence near lower part, above action row) -->
          <div class="reels-caption-wrap" id="reelsCaptionWrap">
            <p class="reels-caption-text" id="reelsCaptionText">
              <span id="reelsCaptionContent">Commercial showcase reel.</span>
              <button type="button" class="reels-caption-more-btn" id="reelsCaptionMoreBtn" style="display:none;">more</button>
            </p>
          </div>

          <!-- Compact Horizontal Outline Action Controls (No oversized pills) -->
          <div class="reels-compact-action-row">
            <div class="reels-compact-actions-left">
              <!-- 1. Like -->
              <button type="button" class="reels-icon-btn" id="reelsLikeBtn" aria-label="Like reel" title="Like">
                <svg id="reelsLikeIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
              </button>

              <!-- 2. Chat / Comment (WhatsApp or Direct inquiry) -->
              <button type="button" class="reels-icon-btn" id="reelsCommentBtn" aria-label="Chat or comment" title="Chat / Message">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
                </svg>
              </button>

              <!-- 3. Share -->
              <button type="button" class="reels-icon-btn" id="reelsShareBtn" aria-label="Share reel" title="Share Reel">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>

            <!-- 4. Relevant Listing Action (Compact Green Button on the Right) -->
            <div class="reels-compact-actions-right">
              <a href="#" class="reels-compact-listing-btn" id="reelsPrimaryActionBtn">
                <span id="reelsPrimaryActionLabel">View Listing</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </a>
            </div>
          </div>

          <!-- Subtle Playback Progress Scrubber Line -->
          <div class="reels-progress-bar-row">
            <div class="reels-progress-track" id="reelsProgressTrack" role="slider" aria-label="Playback progress" tabindex="0">
              <div class="reels-progress-fill" id="reelsProgressFill"></div>
            </div>
          </div>

        </footer>

      </div>

      <!-- App Toast Notification -->
      <div class="reels-toast" id="reelsToast">
        <span>Action completed</span>
      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/data.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/discover.js"></script>
</body>
</html>
